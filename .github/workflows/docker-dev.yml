name: Docker Dev Build

# Builds and pushes a dev Docker image on every push to main.
# Images: ghcr.io/<owner>/gingermail-site:<version>-dev and :latest-dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version tag (e.g., 1.0.9-dev)"
        type: string
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version
        id: version
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository_owner }}/gingermail-site' | tr '[:upper:]' '[:lower:]')"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
            tags="${image}:${tag}"$'\n'"${image}:latest-dev"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION=$(node -p "require('./package.json').version")
            if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
              echo "::error::package.json version is empty; cannot tag Docker image"
              exit 1
            fi
            tag="${VERSION}-dev"
            sha_tag="sha-${GITHUB_SHA:0:12}"
            tags="${image}:${tag}"$'\n'"${image}:latest-dev"$'\n'"${image}:${sha_tag}"
          else
            tag="sha-${GITHUB_SHA:0:12}"
            tags="${image}:${tag}"
          fi

          {
            echo "image=$image"
            echo "tag=$tag"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Docker tags -> ${tags//$'\n'/ }"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
